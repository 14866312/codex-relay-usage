name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  publish-and-verify:
    runs-on: windows-latest
    # One bounded job: the Node expression check, then the self-contained publish directory
    # goes through the full Verify.ps1, which owns per-probe timeouts and failure messages.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'
      - name: Check the runtime usage expression
        run: node ./tests/runtime-expression-check.mjs
      - name: Publish self-contained win-x64
        run: dotnet publish ./src/CodexTokenOverlay/CodexTokenOverlay.csproj -c Release -r win-x64 --self-contained true -o ./artifacts/verify
      - name: Run full release verification
        shell: powershell
        run: ./scripts/Verify.ps1 -ExecutablePath ./artifacts/verify/CodexRelayUsage.exe -OutputDirectory ./artifacts/verification
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: artifacts/verification
          if-no-files-found: ignore
