name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'
      - name: Build Release
        run: dotnet build ./src/CodexTokenOverlay/CodexTokenOverlay.csproj -c Release
      - name: Run synthetic self-test
        shell: powershell
        run: |
          $exe = './src/CodexTokenOverlay/bin/Release/net10.0-windows/CodexRelayUsage.exe'
          $tmp = Join-Path $env:TEMP ('self-test-' + [guid]::NewGuid().ToString('N') + '.json')
          $p = Start-Process -FilePath $exe -ArgumentList @('--self-test', $tmp) -PassThru -WindowStyle Hidden
          $p.WaitForExit(120000) | Out-Null
          if ($p.ExitCode -ne 0) { throw "self-test exit code $($p.ExitCode)" }
          $result = Get-Content $tmp -Raw | ConvertFrom-Json
          if ($result.Failed -ne 0) { throw "self-test failures: $($result.Failed)" }
          Write-Host "passed=$($result.Passed) failed=$($result.Failed)"
          Remove-Item $tmp -Force
